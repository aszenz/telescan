[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telescan"
dynamic = ["version"]
description = "Scan the applications on your machine and report which ones still send telemetry."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "asrar" }]
keywords = ["telemetry", "privacy", "cli", "opt-out", "analytics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aszenz/telescan"
Issues = "https://github.com/aszenz/telescan/issues"
Changelog = "https://github.com/aszenz/telescan/blob/main/CHANGELOG.md"

[dependency-groups]
# Development tools. `uv sync` installs them; uv.lock pins every version.
# `uv lock --upgrade` moves them to the newest version inside these ranges.
dev = [
  "ruff>=0.16,<0.17", # a new minor version can change formatting, so raise it on purpose
  "ty>=0.0.84",
  "twine>=6",
]

[project.scripts]
telescan = "telescan.cli:main"

[tool.setuptools.packages.find]
include = ["telescan*"]

[tool.setuptools.dynamic]
version = { attr = "telescan.__init__.__version__" }

[tool.setuptools.package-data]
telescan = ["data/*.json", "data/apps.d/*.json"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN"]
# Catalog entries are parsed JSON, so Any is the honest type for their values.
ignore = ["ANN401"]

[tool.ty.environment]
python-version = "3.9"
